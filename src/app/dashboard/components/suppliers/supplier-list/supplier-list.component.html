<p-toolbar styleClass="mb-6">
  <ng-template #start>
    <p-button label="New" icon="pi pi-plus" severity="secondary" class="mr-2" (onClick)="openNew()" />
  </ng-template>

  <ng-template #end>
    <p-button label="Export" icon="pi pi-upload" severity="secondary" (onClick)="exportCSV()" />
  </ng-template>
</p-toolbar>

<p-table #dt
         [value]="suppliers()"
         [columns]="cols"
         [exportFilename]="'suppliers'"
         [rows]="10"
         [paginator]="true"
         [rowHover]="true"
         dataKey="id"
         currentPageReportTemplate="Showing {first} to {last} of {totalRecords} suppliers"
         [showCurrentPageReport]="true"
         [rowsPerPageOptions]="[10,20,30]"
         [globalFilterFields]="['id','name','phone','email','address','city','mobile','status']">

  <ng-template #caption>
    <div class="flex items-center justify-between">
      <h5 class="m-0">Manage Suppliers</h5>
      <p-iconfield>
        <p-inputicon styleClass="pi pi-search" />
        <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="Search..." />
      </p-iconfield>
    </div>
  </ng-template>

  <ng-template #header>
    <tr>
      <th pSortableColumn="id" style="min-width: 6rem;">
        ID
        <p-sortIcon field="id" />
      </th>
      <th pSortableColumn="name" style="min-width: 14rem;">
        Name
        <p-sortIcon field="name" />
      </th>
      <th style="min-width: 12rem;">Phone</th>
      <th style="min-width: 12rem;">Mobile</th>
      <th style="min-width: 18rem;">Email</th>
      <th style="min-width: 20rem;">Address</th>
      <th style="min-width: 12rem;">City</th>
      <th pSortableColumn="status" style="min-width: 10rem;">
        Status
        <p-sortIcon field="status" />
      </th>
      <th style="min-width: 10rem;"></th>
    </tr>
  </ng-template>

  <ng-template #body let-row>
    <tr>
      <td>{{ row.id }}</td>
      <td>{{ row.name }}</td>
      <td>{{ row.phone || '—' }}</td>
      <td>{{ row.mobile || '—' }}</td>
      <td>{{ row.email || '—' }}</td>
      <td>{{ row.address || '—' }}</td>
      <td>{{ row.city || '—' }}</td>
      <td>
        <p-tag [value]="getStatusLabel(row.status)"
               [severity]="getStatusSeverity(row.status)" />
      </td>
      <td class="flex gap-2">
        <p-button icon="pi pi-pencil" [rounded]="true" [outlined]="true" class="mr-2"
                  (onClick)="editSupplier(row)" />
        <p-button *ngIf="row.status" icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true"
                  (onClick)="confirmDelete(row)" />
        <p-button *ngIf="!row.status" icon="pi pi-refresh" severity="warn" [rounded]="true" [outlined]="true"
                  (onClick)="reactivateSupplier(row)" />
      </td>
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    <tr>
      <td colspan="9" class="text-center">No suppliers available.</td>
    </tr>
  </ng-template>
</p-table>

<!-- Dialog New / Edit -->
<p-dialog [(visible)]="supplierDialog" [style]="{ width: '800px' }" [modal]="true"
          [draggable]="false" [resizable]="false"
          [header]="supplier.id ? 'Edit Supplier' : 'New Supplier'">
  <ng-template #content>
    <div class="grid grid-cols-12 gap-5">
      <div class="col-span-12">
        <label for="name" class="block font-bold mb-2">Name *</label>
        <input id="name" pInputText [(ngModel)]="supplier.name" required autofocus fluid />
        <small class="text-red-500" *ngIf="submitted && !supplier.name">Name is required.</small>
      </div>

      <div class="col-span-6">
        <label for="phone" class="block font-bold mb-2">Phone</label>
        <input id="phone"
               pInputText
               [(ngModel)]="supplier.phone"
               (input)="onlyDigits('phone')"
               placeholder="Numbers only"
               fluid />
      </div>

      <div class="col-span-6">
        <label for="mobile" class="block font-bold mb-2">Mobile</label>
        <input id="mobile"
               pInputText
               [(ngModel)]="supplier.mobile"
               (input)="onlyDigits('mobile')"
               placeholder="Numbers only"
               fluid />
      </div>

      <div class="col-span-12">
        <label for="email" class="block font-bold mb-2">Email</label>
        <input id="email" type="email" pInputText [(ngModel)]="supplier.email" placeholder="user@domain.com" fluid />
      </div>

      <div class="col-span-8">
        <label for="address" class="block font-bold mb-2">Address</label>
        <input id="address" pInputText [(ngModel)]="supplier.address" fluid />
      </div>

      <div class="col-span-4">
        <label for="city" class="block font-bold mb-2">City</label>
        <input id="city" pInputText [(ngModel)]="supplier.city" fluid />
      </div>
    </div>
  </ng-template>

  <ng-template #footer>
    <p-button label="Cancel" icon="pi pi-times" text (onClick)="hideDialog()" />
    <p-button label="Save" icon="pi pi-check" (onClick)="saveSupplier()" />
  </ng-template>
</p-dialog>

<p-confirmdialog [style]="{ width: '450px' }" />
<p-toast />
